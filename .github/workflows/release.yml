name: Release

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ (github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'kind/release')) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve version
        shell: bash
        run: |
          echo "VERSION=$(make get-version)" >> "$GITHUB_ENV"

      - name: Create Git Tag
        run: |
          git config user.email "ghbot@github.com"
          git config user.name "GitHub Bot"

          git tag -a "${{ env.VERSION }}" -m "Version ${{ env.VERSION }}"
          git push origin "${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          name: v${{ env.VERSION }}
          tag: ${{ env.VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
